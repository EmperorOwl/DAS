name: CI
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python-env

      - name: Run unit tests
        run: |
          cd api
          python -m scripts.tests.run_tests

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Run integration tests
        run: |
          cd api/app
          go test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # govulncheck@latest currently requires a newer toolchain than the
          # project's Go 1.21; scanning with a newer Go is fine.
          go-version: '1.25'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd api
          govulncheck ./...

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt
          pip-audit -r bot/requirements.txt